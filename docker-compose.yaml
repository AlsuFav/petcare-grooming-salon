version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: petcare-db
    environment:
      POSTGRES_DB: petcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty123
    ports:
      - "5433:5432"
    volumes:

      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - petcare-network

volumes:
  db-data:

networks:
  petcare-network:
